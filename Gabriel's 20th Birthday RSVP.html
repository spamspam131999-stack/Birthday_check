<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gabriel’s 20th Birthday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5EFE3; --ink:#1C1A17; --accent:#7A2230; --card:#FBF7EE; --muted:#4A453E; --btn-text:#F5EFE3;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#16140F; --ink:#F1EADB; --accent:#E3A0A8; --card:#1F1C16; --muted:#CFC7B6; --btn-text:#16140F; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#16140F; --ink:#F1EADB; --accent:#E3A0A8; --card:#1F1C16; --muted:#CFC7B6; --btn-text:#16140F; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;line-height:1.4}
.frame{max-width:760px;margin:0 auto;padding:28px 18px 48px}
.border{border:2px solid var(--ink);padding:8px}
.inner{border:1px solid var(--ink);padding:44px 24px 40px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:30px}
.eyebrow{font-weight:600;letter-spacing:.28em;text-transform:uppercase;font-size:17px;margin:0}
.rule{display:flex;align-items:center;gap:14px;width:100%;max-width:300px}
.rule i{flex:1;height:1px;background:var(--ink)}
.rule b{width:9px;height:9px;transform:rotate(45deg);background:var(--accent)}
h1{margin:0;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(46px,11vw,86px);line-height:1.05}
h1 em{display:block;font-weight:400;font-size:.5em;color:var(--accent)}
.panda{width:120px;height:auto}
.when{font-family:'Playfair Display',Georgia,serif;font-size:clamp(22px,5vw,32px);letter-spacing:.06em;text-transform:uppercase;margin:0}
.line{font-weight:600;letter-spacing:.2em;text-transform:uppercase;font-size:20px;margin:0}
.thin{width:min(420px,100%);height:1px;background:var(--ink);border:0;margin:0}
.card{width:100%;max-width:480px;background:var(--card);border:1px solid var(--ink);padding:26px 20px;display:flex;flex-direction:column;gap:16px}
.card h2{margin:0;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:400;font-size:30px;color:var(--accent)}
label{font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:15px;text-align:left}
input{font:inherit;font-size:22px;padding:12px 14px;border:1px solid var(--ink);background:var(--bg);color:var(--ink);width:100%;min-height:48px;border-radius:0}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
button{flex:1 1 180px;min-height:52px;font:inherit;font-weight:600;font-size:20px;letter-spacing:.12em;text-transform:uppercase;padding:12px 16px;cursor:pointer;border-radius:0;border:2px solid var(--ink)}
.yes{background:var(--ink);color:var(--btn-text)}
.no{background:transparent;color:var(--ink)}
button:disabled{opacity:.6;cursor:default}
.link{flex:none;min-height:44px;border:0;background:none;color:var(--accent);text-decoration:underline;text-transform:none;letter-spacing:0;font-size:20px}
.msg{margin:0;min-height:1.4em}
.err{color:var(--accent);font-weight:600}
.sign{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:28px;color:var(--accent);margin:0}
.owner{width:100%;max-width:480px;text-align:left;border-top:1px solid var(--ink);padding-top:20px}
.owner h3{margin:0 0 8px;font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:24px}
.owner ul{list-style:none;margin:8px 0 0;padding:0}
.owner li{padding:6px 0;border-bottom:1px solid var(--muted)}
[hidden]{display:none !important}
</style>
</head>
<body>
<main class="frame">
<div class="border"><div class="inner">

<p class="eyebrow">You’re officially invited</p>
<div class="rule" aria-hidden="true"><i></i><b></b><i></i></div>

<h1><em>It’s my</em>Birthday!</h1>

<svg class="panda" viewBox="0 0 200 190" role="img" aria-label="Illustration of a panda face">
<circle cx="45" cy="42" r="28" fill="#1C1A17"/><circle cx="155" cy="42" r="28" fill="#1C1A17"/>
<ellipse cx="100" cy="108" rx="80" ry="72" fill="#FFFFFF" stroke="#1C1A17" stroke-width="3"/>
<ellipse cx="66" cy="102" rx="20" ry="27" transform="rotate(20 66 102)" fill="#1C1A17"/>
<ellipse cx="134" cy="102" rx="20" ry="27" transform="rotate(-20 134 102)" fill="#1C1A17"/>
<circle cx="68" cy="100" r="7" fill="#FFFFFF"/><circle cx="132" cy="100" r="7" fill="#FFFFFF"/>
<circle cx="69" cy="101" r="3.5" fill="#1C1A17"/><circle cx="131" cy="101" r="3.5" fill="#1C1A17"/>
<ellipse cx="100" cy="130" rx="12" ry="8" fill="#1C1A17"/>
<path d="M100 138 Q100 151 86 152 M100 138 Q100 151 114 152" fill="none" stroke="#1C1A17" stroke-width="3" stroke-linecap="round"/>
</svg>

<p class="when">Sunday · 15 November 2026</p>
<hr class="thin">
<p class="line">4:30 PM onwards</p>
<p class="line">Venue: My House</p>

<section class="card" aria-labelledby="rsvp-h">
  <h2 id="rsvp-h">Will you be there?</h2>
  <div id="ask" style="display:flex;flex-direction:column;gap:16px;text-align:left">
    <label for="nm">Your name</label>
    <input id="nm" type="text" autocomplete="name" maxlength="60" placeholder="Type your name">
    <div class="btns">
      <button class="yes" id="yes" type="button">Yes, I’ll be there</button>
      <button class="no" id="no" type="button">No, can’t make it</button>
    </div>
  </div>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
  <button class="link" id="change" type="button" hidden>Change my answer</button>
</section>

<p class="sign">Enjoy — Gabriel</p>

<section class="owner" id="owner" hidden>
  <h3>Replies</h3>
  <div id="tally"></div>
  <ul id="list"></ul>
</section>

</div></div>
</main>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var db = null, uid = null, saved = null;
  var msg = $('msg'), ask = $('ask'), change = $('change');

  function showDone(a, name){
    ask.hidden = true; change.hidden = false;
    msg.className = 'msg';
    msg.textContent = a === 'yes'
      ? 'Thank you, ' + name + ' — see you on Sunday!'
      : 'Thanks for letting me know, ' + name + '. You’ll be missed.';
  }
  function showAsk(){ ask.hidden = false; change.hidden = true; msg.textContent = ''; }
  function fail(t){ msg.className = 'msg err'; msg.textContent = t; }

  async function send(a){
    var name = $('nm').value.trim();
    if(!name){ fail('Please type your name first.'); $('nm').focus(); return; }
    if(!db || !uid){ fail('Your reply couldn’t be saved here. Please open this page from the link you were sent and sign in.'); return; }
    $('yes').disabled = $('no').disabled = true;
    try{
      await db.doc('rsvps/' + uid).set({ name: name, answer: a, at: Date.now() });
      saved = { name: name, answer: a };
      showDone(a, name);
    }catch(e){
      fail('Something went wrong saving your reply. Please try again.');
    }finally{
      $('yes').disabled = $('no').disabled = false;
    }
  }
  $('yes').addEventListener('click', function(){ send('yes'); });
  $('no').addEventListener('click', function(){ send('no'); });
  change.addEventListener('click', function(){ if(saved) $('nm').value = saved.name; showAsk(); });

  function renderOwner(snap){
    var yes = 0, no = 0, ul = $('list');
    ul.textContent = '';
    snap.docs.forEach(function(d){
      var v = d.data() || {};
      if(v.answer === 'yes') yes++; else if(v.answer === 'no') no++;
      var li = document.createElement('li');
      li.textContent = (v.name || 'Guest') + ' — ' + (v.answer === 'yes' ? 'Yes' : 'No');
      ul.appendChild(li);
    });
    $('tally').textContent = yes + ' coming · ' + no + ' not coming';
    $('owner').hidden = false;
  }

  async function init(){
    if(!window.claude || !claude.use) return;
    try{
      var user = await claude.use('user');
      db = await claude.use('db');
      if(user){ uid = await user.id(); }
      if(db && uid){
        var s = await db.doc('rsvps/' + uid).get();
        if(s.exists){
          var v = s.data();
          saved = { name: v.name, answer: v.answer };
          $('nm').value = v.name || '';
          showDone(v.answer, v.name || 'friend');
        }
      }
      if(db && user && await user.canEdit()){
        db.collection('rsvps').onSnapshot(renderOwner, function(){});
      }
    }catch(e){}
  }
  init();
})();
</script>
</body>
</html>
